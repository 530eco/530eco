<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>530eco | 프리미엄 친환경 청소</title>

<style>
body, html {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Noto Sans KR', sans-serif;

    /* 💡 [수정] 64x64 이미지 기준으로 가운데(정중앙)가 클릭되도록 좌표를 32 32로 변경 */
    cursor: url('logo_cur.png') 32 32, auto;
}

#intro-screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
}

.logo{
    width:220px;
    margin-bottom:25px;
}

h1{
    font-size:1.5rem;
    color:#1f2937;
    margin-bottom:10px;
}

p{
    font-size:1rem;
    color:#6b7280;
    margin-bottom:40px;
}

.btn-start{
    padding:18px 50px;
    background:#00a0e9;
    color:white;
    border:none;
    border-radius:50px;
    font-size:1.1rem;
    font-weight:700;
    transition:all .3s ease;
    box-shadow:0 4px 15px rgba(0,160,233,.3);

    /* 💡 [수정] 버튼 위에서도 가운데(정중앙)가 클릭되도록 좌표를 32 32로 변경 */
    cursor: url('logo_cur.png') 32 32, pointer;
}

.btn-start:hover{
    background:#0080bf;
    transform:translateY(-2px);
}

#main-frame{
    display:none;
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<audio id="bgm" src="새벽의_길.mp3" loop preload="auto"></audio>

<div id="intro-screen">
    <img src="530eco로고.png" alt="530eco 로고" class="logo">

    <h1>530eco와 함께하는 청결한 세상</h1>

    <p>
        음악과 함께 530eco의 프리미엄 서비스를 경험해보세요.
    </p>

    <button class="btn-start" onclick="enterSite()">
        입장하기 (Enter)
    </button>
</div>

<iframe id="main-frame" name="contentFrame"></iframe>

<script>
function enterSite(){

    const audio = document.getElementById('bgm');
    const introScreen = document.getElementById('intro-screen');
    const mainFrame = document.getElementById('main-frame');

    audio.play().catch(function(error){
        console.log("브라우저 환경에 의해 자동재생이 차단될 수 있습니다.");
    });

    introScreen.style.display = 'none';
    mainFrame.style.display = 'block';

    /* 메인 페이지 로드 */
    mainFrame.src = "main.html";
}
</script>

</body>
</html>
